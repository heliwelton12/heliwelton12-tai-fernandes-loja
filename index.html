    <script>
      // O preload de imagens críticas é exclusivo da vitrine.
      // Evita baixar logo/hero desnecessariamente em /admin e /privacidade.
      (() => {
        const path = window.location.pathname.replace(/\/+$/, '') || '/'
        if (path !== '/') return

        const preload = document.createElement('link')
        preload.rel = 'preload'
        preload.as = 'image'
        preload.type = 'image/webp'
        preload.href = window.matchMedia('(max-width: 980px)').matches
          ? '/logo-header.webp'
          : '/hero-modelo.webp'
        preload.setAttribute('fetchpriority', 'high')
        document.head.appendChild(preload)
      })()
    </script>
